name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # Pinned, not windows-latest: that image no longer carries Visual Studio 2022, and
    # this matches the toolchain the plugin is actually developed and listened to on, so
    # a green CI run means the same thing as a green local build. Move it deliberately
    # when the image is retired.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # JUCE is fetched by CMake; cache it so CI is not re-cloning it every run
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-9.0.0

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        # JUCE modules are compiled by several deliverables. Visual Studio otherwise
        # builds this graph serially on the runner, which made the audition-host change
        # push a clean build past ten minutes.
        run: cmake --build build --config Release --parallel 4

      # DSP tests remain headless; the Reverb wrapper test also exercises provisional
      # state, dry identity and 8/16 switching without opening a host window.
      # NSB_WITH_KU100 stays off: that data is CC BY-SA and untracked.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpaceBinaural-VST3
          path: build/plugins/binaural/NekoSpaceBinaural_artefacts/Release/VST3/

      - name: Upload Reverb audition builds
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpaceReverb-Audition-Windows
          path: |
            build/plugins/reverb/NekoSpaceReverb_artefacts/Release/VST3/
            build/plugins/reverb/NekoSpaceReverb_artefacts/Release/Standalone/
            build/plugins/reverb/NekoSpaceReverbPlayer_artefacts/Release/
