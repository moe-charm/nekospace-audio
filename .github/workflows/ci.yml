name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    # Each product gets its own runner. Adding a JUCE GUI target to Reverb must not make
    # Binaural and CleanVoice wait behind it in one fifteen-minute serial build.
    name: windows-${{ matrix.product }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - product: binaural
            targets: NekoSpaceBinaural_VST3 NekoSpaceBinaural_Standalone NekoSpaceBinauralPlayer nsb_tests
            tests: ^binaural_dsp$
          - product: cleanvoice
            targets: CleanVoiceApp cleanvoice cv_tests cv_session_tests
            tests: ^cleanvoice_
          - product: reverb
            targets: NekoSpaceReverb_VST3 NekoSpaceReverb_Standalone NekoSpaceReverbPlayer nsr_analysis_tests nekospace_reverb_analyze nsr_dsp_tests nsr_plugin_tests nsr_phase3_compare
            tests: ^reverb_

    steps:
      - uses: actions/checkout@v4

      # All runners restore the same pinned JUCE source cache. Only the first cache miss
      # uploads it; subsequent runs reuse the immutable key.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-9.0.0

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build ${{ matrix.product }}
        run: cmake --build build --config Release --parallel 4 --target ${{ matrix.targets }}

      - name: Test ${{ matrix.product }}
        run: ctest --test-dir build -C Release --output-on-failure -R '${{ matrix.tests }}'

      - name: Upload Binaural VST3
        if: matrix.product == 'binaural'
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpaceBinaural-VST3
          path: build/plugins/binaural/NekoSpaceBinaural_artefacts/Release/VST3/

      - name: Upload Reverb audition builds
        if: matrix.product == 'reverb'
        uses: actions/upload-artifact@v4
        with:
          name: NekoSpaceReverb-Audition-Windows
          path: |
            build/plugins/reverb/NekoSpaceReverb_artefacts/Release/VST3/
            build/plugins/reverb/NekoSpaceReverb_artefacts/Release/Standalone/
            build/plugins/reverb/NekoSpaceReverbPlayer_artefacts/Release/
