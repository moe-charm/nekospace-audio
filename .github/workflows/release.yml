name: release

# Cutting a release is deliberately a manual act: push a tag such as v0.1.0-alpha.
# Nothing here runs on an ordinary commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    # Pinned for reproducibility — see the note in ci.yml. A release must be built with
    # a known toolchain, not with whatever the latest runner image happens to carry.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      # A release that has not passed its own acceptance tests is not a release.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/NekoSpaceBinaural-${{ github.ref_name }}-Windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $art = "build/plugins/binaural/NekoSpaceBinaural_artefacts/Release"
          Copy-Item -Recurse "$art/VST3/NekoSpace Binaural.vst3" $out
          Copy-Item "$art/Standalone/NekoSpace Binaural.exe" $out
          # AGPL section 4: a binary distribution carries its licence and its notices
          Copy-Item LICENSE $out
          Copy-Item CHANGELOG.md $out
          Copy-Item README.md $out
          Copy-Item docs/third-party-licenses.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "$out.zip"

      # The release notes are this version's section of the changelog, not the whole file.
      # Pasting the whole file works exactly once — on the second release it buries the
      # new entry under the old ones.
      - name: Release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$version]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $version" }
          $rest = $lines[$start..($lines.Count - 1)]
          $next = ($rest | Select-String -Pattern '^## \[').LineNumber | Select-Object -First 1
          $body = if ($next) { $rest[0..($next - 2)] } else { $rest }
          $body | Set-Content release-notes.md -Encoding utf8

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release-notes.md
          draft: true          # review before it goes live
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
